<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>线上服务 · 卓正医疗</title>
  <meta name="description" content="日常健康管理 · 专项健康管理 · 线上问诊，不用去诊所也能持续获得健康与医疗服务。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="online-service.css" />
  <link rel="icon" type="image/png" href="branding-pic/icon.png" />
</head>
<body>
  <div class="phone">
    <!-- 顶部导航（标准 H5：返回 / 居中标题 / 更多） -->
    <header class="topbar">
      <button type="button" class="topbar__back" aria-label="返回">
        <svg viewBox="0 0 24 24" fill="none"><path d="M15 6L9 12L15 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="topbar__title">线上服务</div>
      <button type="button" class="topbar__more" aria-label="更多">
        <span></span><span></span><span></span>
      </button>
    </header>

    <!-- 状态切换菜单 -->
    <div class="dropdown" id="stateMenu" hidden>
      <a class="dropdown__item" href="online-service-new.html">新客状态</a>
      <div class="dropdown__sep"></div>
      <a class="dropdown__item is-current" href="online-service.html">老客状态<span class="dropdown__check">✓</span></a>
    </div>

    <main class="page">
      <!-- 顶部问候 -->
      <div class="greet">
        <p class="greet__hi">张先生，你好！</p>
      </div>

      <!-- ① 日常健康管理 -->
      <section class="block">
        <div class="block__head">
          <img class="block__icon" src="branding-pic/icon.png" alt="" aria-hidden="true" />
          <h2 class="block__title">日常健康管理</h2>
          <button type="button" class="block__head-link" data-toast="正在打开全部健康事项">全部<span class="arw">→</span></button>
        </div>

        <div class="dh-list">
          <button type="button" class="dh-card" data-toast="正在打开「个人健康改善计划」">
            <span class="dh-card__icon dh-card__icon--teal" aria-hidden="true">
              <img src="branding-pic/icons/健康todo.svg" alt="" aria-hidden="true" />
            </span>
            <div class="dh-card__body">
              <div class="dh-card__row">
                <h3 class="dh-card__title">个人健康改善计划</h3>
                <span class="dh-card__chip dh-card__chip--teal">Day 86</span>
              </div>
              <p class="dh-card__sub">已完成 86 天 · 距目标还有 14 天</p>
            </div>
            <span class="dh-card__go" aria-hidden="true">→</span>
          </button>

          <button type="button" class="dh-card" data-toast="正在打开血脂血糖复查">
            <span class="dh-card__icon dh-card__icon--green" aria-hidden="true">
              <img src="branding-pic/icons/健康测评.svg" alt="" aria-hidden="true" />
            </span>
            <div class="dh-card__body">
              <div class="dh-card__row">
                <h3 class="dh-card__title">血脂血糖复查</h3>
                <span class="dh-card__chip dh-card__chip--green">10 天后</span>
              </div>
              <p class="dh-card__sub">上次检查 2026-08-25 · 建议按计划复查</p>
            </div>
            <span class="dh-card__go" aria-hidden="true">→</span>
          </button>

          <button type="button" class="dh-card" data-toast="正在打开随访安排">
            <span class="dh-card__icon dh-card__icon--blue" aria-hidden="true">
              <img src="branding-pic/icons/问护士.svg" alt="" aria-hidden="true" />
            </span>
            <div class="dh-card__body">
              <div class="dh-card__row">
                <h3 class="dh-card__title">医生随访</h3>
                <span class="dh-card__chip dh-card__chip--blue">明天 10:30</span>
              </div>
              <p class="dh-card__sub">皮肤科 · 张医生 · 视频问诊</p>
            </div>
            <span class="dh-card__go" aria-hidden="true">→</span>
          </button>

          <button type="button" class="dh-card" data-toast="正在查看儿童保健">
            <span class="dh-card__icon dh-card__icon--warm" aria-hidden="true">
              <img src="branding-pic/icons/生长曲线.svg" alt="" aria-hidden="true" />
            </span>
            <div class="dh-card__body">
              <div class="dh-card__row">
                <h3 class="dh-card__title">儿童保健提醒</h3>
                <span class="dh-card__chip dh-card__chip--warm">建议预约</span>
              </div>
              <p class="dh-card__sub">乐乐 3 岁 8 个月 · 下一次常规保健</p>
            </div>
            <span class="dh-card__go" aria-hidden="true">→</span>
          </button>
        </div>
      </section>

      <!-- ② 专项健康管理 -->
      <section class="block">
        <div class="block__head">
          <img class="block__icon" src="branding-pic/icon.png" alt="" aria-hidden="true" />
          <h2 class="block__title">专项健康管理</h2>
        </div>
        <p class="block__sub">针对你的健康问题，获得长期专业支持</p>

        <div class="sp-list">
          <!-- 重点专项：科学减重（用药陪跑 · 进行中） -->
          <div class="wcard">
            <article class="card">
              <header class="card__hd">
                <span class="card__logo" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(0,0.5)"><path d="M6.5 9.5a5.5 5.5 0 0 1 11 0c0 4.5-5.5 9-5.5 9s-5.5-4.5-5.5-9Z"/><circle cx="12" cy="9.5" r="2.2"/></g></svg>
                </span>
                <h3 class="card__nm">科学减重</h3>
                <span class="card__st card__st--teal">进行中</span>
              </header>

              <div style="margin-top: 14px">
                <div class="rk">
                  <span class="rk__ico" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 9a6 6 0 1 0-12 0c0 5-2 6-2 6h16s-2-1-2-6"/><path d="M10.5 20a2 2 0 0 0 3 0"/></svg>
                  </span>
                  <span class="rk__tx">
                    <b>续药提醒</b>
                    <p>已购买的剂量预计两周内用完，医生已按你近期数据情况确认下一疗程，现在确认需要，直接冷链送药到家</p>
                  </span>
                </div>

                <div class="wld" style="margin-top: 14px">
                  <span class="wld__n">-3.1<i>kg</i></span>
                  <button type="button" class="wld__btn" data-toast="正在打开体重记录">记录数据</button>
                </div>
                <p class="wld__meta">已坚持 28 天 · 体重 68.4kg → 65.3kg</p>

                <button type="button" class="kb" style="margin-top: 18px" data-toast="正在打开科学减重知识库">
                  <span class="kb__ico" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(0,0.5)"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H10a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H5.5A1.5 1.5 0 0 1 4 15.5Z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H14a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h4.5a1.5 1.5 0 0 0 1.5-1.5Z"/></g></svg>
                  </span>
                  <span class="kb__t">科学减重知识库</span>
                  <span class="kb__go" aria-hidden="true">›</span>
                </button>

                <div class="divider" style="margin-top: 14px"></div>
                <div class="duo" style="margin-top: 12px">
                  <button type="button" class="cb__btn cb__btn--ghost" data-toast="正在进入 AI 减重助理">AI 减重助理</button>
                  <button type="button" class="cb__btn cb__btn--solid" data-toast="正在为你安排线上续药">线上续药</button>
                </div>
              </div>
            </article>
          </div>

          <!-- 紧凑 2x2 卡片 -->
          <div class="sp-grid">
            <button type="button" class="sp sp--compact" data-toast="正在打开「痛风控制」专项管理">
              <span class="sp__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="8" />
                  <path d="M13.1 7.4 9.6 12.6h3l-.5 4.2 3.6-5.4h-3.1Z" />
                </svg>
              </span>
              <div class="sp__body">
                <h3 class="sp__name">痛风控制</h3>
                <p class="sp__desc">控制尿酸，减少痛风发作</p>
              </div>
              <span class="sp__go" aria-hidden="true">→</span>
            </button>

            <button type="button" class="sp sp--compact" data-toast="正在打开「过敏管理」专项管理">
              <span class="sp__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="3.2" />
                  <path d="M12 8.8V4M12 15.2V20M8.8 12H4M15.2 12H20" />
                  <path d="M6.6 6.6 9.3 9.3M17.4 17.4 14.7 14.7M17.4 6.6 14.7 9.3M6.6 17.4 9.3 14.7" />
                </svg>
              </span>
              <div class="sp__body">
                <h3 class="sp__name">过敏管理</h3>
                <p class="sp__desc">找到原因，获得长期改善方案</p>
              </div>
              <span class="sp__go" aria-hidden="true">→</span>
            </button>

            <button type="button" class="sp sp--compact" data-toast="正在打开「痤疮管理」专项管理">
              <span class="sp__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="8" />
                  <path d="M9.4 10.6h.01M14.6 10.6h.01" />
                  <path d="M9.6 15.3c1.4 1 3.4 1 4.8 0" />
                </svg>
              </span>
              <div class="sp__body">
                <h3 class="sp__name">痤疮管理</h3>
                <p class="sp__desc">针对不同皮肤问题长期治疗管理</p>
              </div>
              <span class="sp__go" aria-hidden="true">→</span>
            </button>

            <button type="button" class="sp sp--compact" data-toast="正在打开「慢病管理」专项管理">
              <span class="sp__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <g transform="matrix(1.333,0,0,1.333,-4,-5.33)" stroke-width="1.2">
                    <path d="M20 12.6c0 4.4-8 7.9-8 7.9s-8-3.5-8-7.9a4.6 4.6 0 0 1 8-2.8 4.6 4.6 0 0 1 8 2.8Z" />
                    <path d="M4.6 12.4h3l1.4-2 2 3.6 1.8-2.6h3.6" />
                  </g>
                </svg>
              </span>
              <div class="sp__body">
                <h3 class="sp__name">慢病管理</h3>
                <p class="sp__desc">针对长期慢性问题持续管理</p>
              </div>
              <span class="sp__go" aria-hidden="true">→</span>
            </button>
          </div>

          <!-- 心理健康 + 查看全部（双列） -->
          <div class="sp-row">
            <button type="button" class="sp sp--compact" data-toast="正在打开「心理健康」专项管理">
              <span class="sp__icon" aria-hidden="true">
                <img src="branding-pic/icons/心理咨询.svg" alt="" aria-hidden="true" />
              </span>
              <div class="sp__body">
                <h3 class="sp__name">心理健康</h3>
                <p class="sp__desc">获得持续的心理健康支持</p>
              </div>
              <span class="sp__go" aria-hidden="true">→</span>
            </button>

            <button type="button" class="sp sp--all" data-toast="正在打开全部专项管理">
              查看全部专项管理<span class="sp__go" aria-hidden="true">→</span>
            </button>
          </div>
        </div>
      </section>

      <!-- ③ 线上问诊 -->
      <section class="block">
        <div class="block__head">
          <img class="block__icon" src="branding-pic/icon.png" alt="" aria-hidden="true" />
          <h2 class="block__title">线上问诊</h2>
        </div>

        <button type="button" class="consult" data-toast="正在为你接入在线问诊">
          <span class="consult__icon" aria-hidden="true">
            <img src="branding-pic/icons/线上问诊.svg" alt="" aria-hidden="true" />
          </span>
          <div class="consult__text">
            <h3 class="consult__name">在线问诊</h3>
            <p class="consult__desc">身体不舒服或有健康问题，在线咨询卓正医生</p>
            <div class="chips">
              <span>图文</span><i>·</i><span>电话</span><i>·</i><span>视频</span>
            </div>
          </div>
          <span class="consult__go" aria-hidden="true">→</span>
        </button>

        <button type="button" class="consult consult--sub" data-toast="正在为你介绍线上家庭医生">
          <span class="consult__icon consult__icon--sm" aria-hidden="true">
            <img src="branding-pic/icons/卓正会员.svg" alt="" aria-hidden="true" />
          </span>
          <div class="consult__text">
            <h3 class="consult__name">线上家庭医生</h3>
            <p class="consult__desc">一位长期了解你和家人的医生</p>
            <p class="consult__note">长期在线咨询 · 持续健康支持</p>
          </div>
          <span class="consult__go" aria-hidden="true">→</span>
        </button>
      </section>

      <p class="footnote">线上服务不能替代线下面诊与急诊处理，如出现急症请及时就医或拨打 120。</p>
    </main>
  </div>

  <!-- 轻提示 -->
  <div class="toast" id="toast" hidden></div>

  <script src="online-service.js"></script>
</body>
</html>
