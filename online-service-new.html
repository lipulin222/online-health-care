<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>线上服务 · 卓正医疗（纯新用户）</title>
  <meta name="description" content="日常健康管理 · 专项健康管理 · 线上问诊，不用去诊所也能持续获得健康与医疗服务。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="online-service.css" />
  <link rel="icon" type="image/png" href="branding-pic/icon.png" />
</head>
<body>
  <div class="phone">
    <!-- 顶部导航（标准 H5：返回 / 居中标题 / 更多） -->
    <header class="topbar">
      <button type="button" class="topbar__back" aria-label="返回">
        <svg viewBox="0 0 24 24" fill="none"><path d="M15 6L9 12L15 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="topbar__title">线上服务</div>
      <button type="button" class="topbar__more" aria-label="更多">
        <span></span><span></span><span></span>
      </button>
    </header>

    <!-- 状态切换菜单 -->
    <div class="dropdown" id="stateMenu" hidden>
      <a class="dropdown__item is-current" href="online-service-new.html">新客状态<span class="dropdown__check">✓</span></a>
      <div class="dropdown__sep"></div>
      <a class="dropdown__item" href="online-service.html">老客状态</a>
    </div>

    <main class="page">
      <!-- 顶部问候 -->
      <div class="greet">
        <p class="greet__hi">尊敬的卓正用户，你好！</p>
        <button type="button" class="greet__reg" data-toast="正在打开注册页面">注册</button>
      </div>

      <!-- ① 日常健康管理：建立第一次健康关系 -->
      <section class="block">
        <div class="block__head">
          <img class="block__icon" src="branding-pic/icon.png" alt="" aria-hidden="true" />
          <h2 class="block__title">日常健康管理</h2>
        </div>

        <div class="onboard">
          <span class="onboard__mark" aria-hidden="true">
            <img src="branding-pic/icons/健康测评.svg" alt="" aria-hidden="true" />
          </span>

          <h3 class="onboard__title">你的健康，从一次了解开始</h3>
          <p class="onboard__desc">解读近期体检报告，看看目前有哪些值得关注的问题，并获得适合你的健康建议。</p>

          <a class="onboard__btn" href="report-loading.html">开始健康扫描<span class="onboard__btn-arrow">→</span></a>

          <div class="onboard__links">
            <button type="button" class="onboard__link" data-toast="正在引导你上传外院体检报告">上传外院体检报告</button>
          </div>
        </div>
      </section>

      <!-- ② 专项健康管理：解决一个明确的健康问题 -->
      <section class="block">
        <div class="block__head">
          <img class="block__icon" src="branding-pic/icon.png" alt="" aria-hidden="true" />
          <h2 class="block__title">专项健康管理</h2>
        </div>
        <div class="sp-list">
          <!-- 首个重点服务：科学减重（阶段可切换：购前 → 决策 → 陪跑 → 续费 → 回顾） -->
          <div class="wcard" data-wlcard data-start-stage="1">
            <article class="card">
              <header class="card__hd">
                <span class="card__logo" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 9.5a5.5 5.5 0 0 1 11 0c0 4.5-5.5 9-5.5 9s-5.5-4.5-5.5-9Z"/><circle cx="12" cy="9.5" r="2.2"/></svg>
                </span>
                <h3 class="card__nm">科学减重</h3>
                <button type="button" class="card__st card__st--grey" data-stage-toggle title="点击切换减重阶段（购前 → 决策 → 陪跑 → 续费 → 回顾）" aria-label="减重阶段：未开始（点击切换到下一阶段）">未开始</button>
              </header>

              <!-- 阶段核心区：由 online-service.js 按阶段重绘；以下为初始阶段（① 购前）静态兜底 -->
              <div data-stage-body>
                <div class="gk">
                  <a class="gk__h" href="https://lipulin222.github.io/online-health-care/patient-education/index.html">
                    想了解什么？<span class="gk__go" aria-hidden="true">›</span>
                  </a>
                  <div class="roll" data-roll>
                    <a class="roll__t is-on" href="https://lipulin222.github.io/online-health-care/patient-education/index.html">GLP-1 到底是怎么起作用的</a>
                    <a class="roll__t" href="https://lipulin222.github.io/online-health-care/patient-education/index.html">没明显副作用，是不是药没效果</a>
                    <a class="roll__t" href="https://lipulin222.github.io/online-health-care/patient-education/index.html">减重期间能喝酒吗</a>
                    <a class="roll__t" href="https://lipulin222.github.io/online-health-care/patient-education/index.html">漏服了一次怎么办</a>
                    <a class="roll__t" href="https://lipulin222.github.io/online-health-care/patient-education/index.html">平台期怎么判断，要紧吗</a>
                  </div>
                  <div class="ct">
                    <a class="ct__c" href="https://lipulin222.github.io/online-health-care/patient-education/index.html"><b>效果</b>多久有变化</a>
                    <a class="ct__c" href="https://lipulin222.github.io/online-health-care/patient-education/index.html"><b>安全</b>副作用说明</a>
                    <a class="ct__c" href="https://lipulin222.github.io/online-health-care/patient-education/index.html"><b>怎么吃</b>饮食与运动</a>
                    <a class="ct__c" href="https://lipulin222.github.io/online-health-care/patient-education/index.html"><b>过程</b>平台期与复查</a>
                  </div>
                </div>

                <div class="aux">
                  <div class="ag ag--cb">
                    <div class="cb">
                      <a class="cb__btn cb__btn--ghost" href="https://lipulin222.github.io/online-health-care/weight-loss-agent-page/index.html">AI 减重助理</a>
                      <span class="cb__s">7×24 响应</span>
                    </div>
                    <div class="cb">
                      <a class="cb__btn cb__btn--solid" href="https://lipulin222.github.io/online-health-care/weight-management/Medication-eligibility-assessment/index.html">定制减重方案</a>
                      <span class="cb__s">1分钟快速评估</span>
                    </div>
                  </div>
                </div>
              </div>
            </article>
          </div>

          <!-- 双列服务卡片 -->
          <div class="sp-grid">
            <button type="button" class="sp sp--compact" data-toast="正在打开「痛风控制」专项管理">
              <span class="sp__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="8" />
                  <path d="M13.1 7.4 9.6 12.6h3l-.5 4.2 3.6-5.4h-3.1Z" />
                </svg>
              </span>
              <div class="sp__body">
                <h3 class="sp__name">痛风控制</h3>
                <p class="sp__desc">控制尿酸，减少痛风反复发作</p>
              </div>
              <span class="sp__go" aria-hidden="true">→</span>
            </button>

            <button type="button" class="sp sp--compact" data-toast="正在打开「过敏管理」专项管理">
              <span class="sp__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="3.2" />
                  <path d="M12 8.8V4M12 15.2V20M8.8 12H4M15.2 12H20" />
                  <path d="M6.6 6.6 9.3 9.3M17.4 17.4 14.7 14.7M17.4 6.6 14.7 9.3M6.6 17.4 9.3 14.7" />
                </svg>
              </span>
              <div class="sp__body">
                <h3 class="sp__name">过敏管理</h3>
                <p class="sp__desc">找到原因，获得长期改善方案</p>
              </div>
              <span class="sp__go" aria-hidden="true">→</span>
            </button>

            <button type="button" class="sp sp--compact" data-toast="正在打开「痤疮管理」专项管理">
              <span class="sp__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="8" />
                  <path d="M9.4 10.6h.01M14.6 10.6h.01" />
                  <path d="M9.6 15.3c1.4 1 3.4 1 4.8 0" />
                </svg>
              </span>
              <div class="sp__body">
                <h3 class="sp__name">痤疮管理</h3>
                <p class="sp__desc">针对不同皮肤问题进行持续治疗管理</p>
              </div>
              <span class="sp__go" aria-hidden="true">→</span>
            </button>

            <button type="button" class="sp sp--compact" data-toast="正在打开「慢病管理」专项管理">
              <span class="sp__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <g transform="translate(0,-0.85)">
                    <path d="M20 12.6c0 4.4-8 7.9-8 7.9s-8-3.5-8-7.9a4.6 4.6 0 0 1 8-2.8 4.6 4.6 0 0 1 8 2.8Z" />
                    <path d="M4.6 12.4h3l1.4-2 2 3.6 1.8-2.6h3.6" />
                  </g>
                </svg>
              </span>
              <div class="sp__body">
                <h3 class="sp__name">慢病管理</h3>
                <p class="sp__desc">针对长期健康问题进行持续健康支持</p>
              </div>
              <span class="sp__go" aria-hidden="true">→</span>
            </button>
          </div>

          <!-- 心理健康 + 查看全部（双列） -->
          <div class="sp-row">
            <button type="button" class="sp sp--compact" data-toast="正在打开「心理健康」专项管理">
              <span class="sp__icon" aria-hidden="true">
                <img src="branding-pic/icons/心理咨询.svg" alt="" aria-hidden="true" />
              </span>
              <div class="sp__body">
                <h3 class="sp__name">心理健康</h3>
                <p class="sp__desc">获得专业、持续的心理健康支持</p>
              </div>
              <span class="sp__go" aria-hidden="true">→</span>
            </button>

            <button type="button" class="sp sp--all" data-toast="正在打开全部专项管理">
              查看全部专项管理<span class="sp__go" aria-hidden="true">→</span>
            </button>
          </div>
        </div>
      </section>

      <!-- ③ 线上问诊：现在就有问题，直接找医生 -->
      <section class="block">
        <div class="block__head">
          <img class="block__icon" src="branding-pic/icon.png" alt="" aria-hidden="true" />
          <h2 class="block__title">线上问诊</h2>
        </div>

        <button type="button" class="consult" data-toast="正在为你接入在线问诊">
          <span class="consult__icon" aria-hidden="true">
            <img src="branding-pic/icons/线上问诊.svg" alt="" aria-hidden="true" />
          </span>
          <div class="consult__text">
            <h3 class="consult__name">在线问诊</h3>
            <p class="consult__desc">身体不舒服或有健康问题，在线咨询卓正医生。</p>
            <div class="chips">
              <span>图文</span><i>·</i><span>电话</span><i>·</i><span>视频</span>
            </div>
            <span class="consult__cta">去问医生<span class="consult__cta-arrow">→</span></span>
          </div>
          <span class="consult__go" aria-hidden="true">→</span>
        </button>

        <button type="button" class="consult consult--sub" data-toast="正在为你介绍线上家庭医生">
          <span class="consult__icon consult__icon--sm" aria-hidden="true">
            <img src="branding-pic/icons/卓正会员.svg" alt="" aria-hidden="true" />
          </span>
          <div class="consult__text">
            <h3 class="consult__name">线上家庭医生</h3>
            <p class="consult__desc">一位长期了解你和家人的医生。</p>
            <p class="consult__note">长期在线咨询 · 持续健康支持</p>
            <span class="consult__cta">了解家庭医生<span class="consult__cta-arrow">→</span></span>
          </div>
          <span class="consult__go" aria-hidden="true">→</span>
        </button>
      </section>

      <p class="footnote">线上服务不能替代线下面诊与急诊处理，如出现急症请及时就医或拨打 120。</p>
    </main>
  </div>

  <!-- 轻提示 -->
  <div class="toast" id="toast" hidden></div>

  <script src="online-service.js"></script>
</body>
</html>
