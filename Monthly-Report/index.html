<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>减重月报 · 科学减重</title>

  <link rel="stylesheet" href="monthly.css" />
</head>
<body>
  <div class="shell">
    <div class="phone" id="phone">
      <header class="topbar">
        <button class="topbar__back" id="backBtn" aria-label="返回">
          <svg viewBox="0 0 24 24" fill="none"><path d="M15 6L9 12L15 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="topbar__title">减重月报</div>
        <button class="topbar__more" id="moreBtn" aria-label="更多"><span></span><span></span><span></span></button>
      </header>

      <!-- 空状态：还没有第一期月报 -->
      <main class="page" id="empty" hidden>
        <section class="ph card">
          <span class="ph__ico" aria-hidden="true">
            <svg viewBox="0 0 48 48" fill="none">
              <rect x="8" y="12" width="32" height="26" rx="4" stroke="currentColor" stroke-width="2"/>
              <path d="M8 20h32" stroke="currentColor" stroke-width="2"/>
              <path d="M17 9v6M31 9v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M16 30l4 4 8-8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <h1 class="ph__t">你的第 1 份月报还在准备中</h1>
          <p class="ph__d">满 4 周后，这里会汇总这段时间的体重与体成分变化、用药和复查情况，饮食运动的复盘，以及下个月要做的具体调整。</p>
          <a class="ph__btn" href="?m=1">先看一份示例月报</a>
          <a class="ph__btn" href="../online-service.html?stage=3&data=none" style="margin-left:8px">返回首页</a>
        </section>
      </main>

      <!-- 月报正文（JS 渲染） -->
      <main class="page" id="report" hidden></main>

      <!-- 吸底 CTA -->
      <div class="cta" id="cta" hidden></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="../shared.js"></script>
  <script src="monthly.js"></script>

</html>
