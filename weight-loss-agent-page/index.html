<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>减重顾问</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">
    <!-- 顶部导航 -->
    <header class="app-header">
      <button class="app-header__btn" id="backBtn" aria-label="返回">
        <svg viewBox="0 0 24 24" fill="none"><path d="M15 6L9 12L15 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1 class="app-header__title">减重顾问</h1>
      <div class="app-header__actions">
        <button class="app-header__btn" id="moreBtn" aria-label="更多">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="6" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="18" cy="12" r="2" fill="currentColor"/></svg>
        </button>
      </div>
    </header>

    <!-- 聊天主体 -->
    <main class="chat" id="chat">
      <div class="chat__list" id="chatList">
        <!-- 合规提示条：常驻会话顶部，不进入对话上下文 -->
        <div class="chat__notice">
          AI 建议仅供参考，不构成诊断或处方。用药剂量调整、停药、身体不适请与你的医生确认。
        </div>
      </div>
    </main>

    <!-- 底部功能区 -->
    <div class="footer-actions">
      <button class="chip" data-action="weight">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 20h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M6 20V9a6 6 0 0 1 12 0v11" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 9v4.5M10 11.5L12 9.5l2 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>体重变化</span>
      </button>
      <button class="chip" data-action="medicine">
        <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="8" width="18" height="10" rx="5" stroke="currentColor" stroke-width="1.8"/><path d="M8 8V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" stroke="currentColor" stroke-width="1.8"/><path d="M9 12h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span>用药反应</span>
      </button>
      <button class="chip" data-action="diet">
        <svg viewBox="0 0 24 24" fill="none"><path d="M5 3v8a2 2 0 0 0 4 0V3M7 11v10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M17 3c-1.5 1.5-2 3.5-2 6s.5 4 2 4v8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>饮食运动</span>
      </button>
      <button class="chip" data-action="clinic">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 5h16v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 3v4M15 3v4M4 10h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M10 14h4M12 12v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span>预约复诊</span>
      </button>
      <button class="chip" data-action="human">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 12C14.2091 12 16 10.2091 16 8C16 5.79086 14.2091 4 12 4C9.79086 4 8 5.79086 8 8C8 10.2091 9.79086 12 12 12Z" stroke="currentColor" stroke-width="1.8"/><path d="M6 20C6 16.6863 8.68629 14 12 14C15.3137 14 18 16.6863 18 20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>转真人顾问</span>
      </button>
    </div>

    <!-- 输入栏 -->
    <div class="input-bar">
      <div class="input-bar__wrap">
        <input type="text" class="input-bar__field" id="messageInput" placeholder="说说体重、用药或饮食上的问题~" autocomplete="off" />
        <button class="input-bar__send" id="sendBtn" aria-label="发送">
          <svg viewBox="0 0 24 24" fill="none"><path d="M3 12L21 4L13 22L11 14L3 12Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>

    <!-- 轻提示 -->
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <!-- 咨询小结弹层 -->
  <div class="sheet" id="summarySheet" hidden>
    <div class="sheet__mask" data-close="1"></div>
    <div class="sheet__panel" role="dialog" aria-modal="true" aria-label="减重咨询小结">
      <div class="sheet__bar"><span></span></div>
      <div class="sheet__head">
        <div class="sheet__title">本次咨询小结</div>
        <button class="sheet__close" id="summaryClose" aria-label="关闭">
          <svg viewBox="0 0 24 24" fill="none"><path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="sheet__body" id="summaryBody"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
