<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>减重评估报告 · 科学减重</title>
  <meta name="description" content="科学减重评估报告：减重必要性、方式适用性、饮食运动方案与预期效果的初步评估。" />
  <link rel="icon" href="../../branding-pic/icon.png" />
  <link rel="stylesheet" href="report.css" />
</head>
<body>
  <div class="shell">
    <div class="phone" id="phone">
      <header class="topbar" id="topbar">
        <button class="topbar__back" id="backBtn" aria-label="返回">
          <svg viewBox="0 0 24 24" fill="none"><path d="M15 6L9 12L15 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="topbar__title" id="topTitle">减重评估报告</div>
        <button class="topbar__more" id="moreBtn" aria-label="更多"><span></span><span></span><span></span></button>
      </header>

      <main class="page" id="view"></main>

      <!-- 底部 CTA 吸底常驻：直接写在 HTML 里，JS 只负责绑事件（脚本异常时仍有下单入口） -->
      <footer class="paybar" id="paybar">
        <div class="paybar__p">
          <button type="button" class="paybar__lab" id="pkgBtn" aria-haspopup="dialog" aria-controls="pkgSheet">
            科学减重首诊套餐
            <svg class="paybar__chev" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 15l6-6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <span class="paybar__pr"><b>¥790</b><i>原价 ¥1,380</i></span>
        </div>
        <button class="btn" id="buyBtn" type="button">开始科学减重</button>
      </footer>
    </div>
  </div>

  <!-- 减重套餐内容 · 半屏浮层（点吸底栏「科学减重首诊套餐 ˄」弹起） -->
  <div class="sheet" id="pkgSheet" hidden>
    <div class="sheet__mask" data-close="1"></div>
    <div class="sheet__panel" role="dialog" aria-modal="true" aria-label="减重套餐内容">
      <div class="sheet__bar"><span></span></div>
      <div class="sheet__head">
        <div class="sheet__title">减重套餐内容</div>
        <button class="sheet__close" id="pkgClose" aria-label="关闭">
          <svg viewBox="0 0 24 24" fill="none"><path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="sheet__body" id="pkgBody"></div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="../../shared.js"></script>
  <script src="report.js"></script>
</body>
</html>
