<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>减重评估报告 · 体重管理</title>
  <meta name="description" content="体重管理评估报告：减重必要性、方式适用性、饮食运动方案与预期效果的初步评估。" />
  <link rel="icon" href="../../branding-pic/icon.png" />
  <link rel="stylesheet" href="report.css" />
</head>
<body>
  <div class="shell">
    <div class="phone" id="phone">
      <header class="topbar" id="topbar">
        <button class="topbar__back" id="backBtn" aria-label="返回">
          <svg viewBox="0 0 24 24" fill="none"><path d="M15 6L9 12L15 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="topbar__title" id="topTitle">减重评估报告</div>
        <button class="topbar__more" id="moreBtn" aria-label="更多"><span></span><span></span><span></span></button>
      </header>

      <main class="page" id="view"></main>

      <!-- 吸底常驻按钮：内容由 JS 按分支注入（脚本异常时不渲染按钮，避免误导） -->
      <footer class="paybar" id="paybar" hidden></footer>
    </div>
  </div>

  <!-- 预约面诊 · 二维码半浮层（慢病/轻微异常分支点「预约面诊」弹起） -->
  <div class="sheet" id="qrSheet" hidden>
    <div class="sheet__mask" data-close="1"></div>
    <div class="sheet__panel" role="dialog" aria-modal="true" aria-label="线上咨询">
      <div class="sheet__bar"><span></span></div>
      <div class="sheet__head">
        <div class="sheet__title">线上咨询</div>
        <button class="sheet__close" id="qrClose" data-close="1" aria-label="关闭">
          <svg viewBox="0 0 24 24" fill="none"><path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="sheet__body qr-body">
        <img class="qr" src="qr-assistant.png" alt="专属健康护士二维码" />
        <p class="qr-s">微信扫一扫，添加你的专属健康护士</p>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="../../shared.js"></script>
  <script src="report.js"></script>
</body>
</html>
