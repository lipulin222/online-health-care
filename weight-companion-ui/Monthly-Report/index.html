<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>减重月报 · 体重管理</title>
  <meta name="description" content="体重管理月报：本月减重数据分析与下个月的饮食、运动建议。" />
  <link rel="icon" href="../branding-pic/icon.png" />
  <link rel="stylesheet" href="monthly.css" />
</head>
<body>
  <div class="shell">
    <div class="phone" id="phone">
      <header class="topbar" id="topbar">
        <button class="topbar__back" id="backBtn" aria-label="返回">
          <svg viewBox="0 0 24 24" fill="none"><path d="M15 6L9 12L15 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="topbar__title" id="topTitle">减重月报</div>
        <button class="topbar__more" id="moreBtn" aria-label="更多"><span></span><span></span><span></span></button>
      </header>

      <!-- 空状态：还没有第一期月报 -->
      <main class="page" id="empty" hidden>
        <section class="ph card">
          <span class="ph__ico" aria-hidden="true">
            <img src="../assets/empty-states/empty-no-content.png" alt="" />
          </span>
          <h1 class="ph__t">第 1 份月报还在准备中</h1>
          <p class="ph__d">满 4 周后，这里会给出这个月的减重数据分析，以及下个月的饮食与运动建议。</p>
          <a class="ph__btn" href="?m=1">看示例</a>
          <a class="ph__btn" href="../online-service.html?stage=3&data=none" style="margin-left:8px">返回首页</a>
        </section>
      </main>

      <!-- 月报正文（JS 渲染） -->
      <main class="page" id="report" hidden></main>

      <!-- 第一步：本月状态快问快答 -->
      <section class="gate" id="gate" hidden>
        <div class="gate__hd">
          <div class="gate__ttl" id="gateTtl">快问快答</div>
        </div>
        <div class="gate__bd" id="gateBody"></div>
        <div class="gate__ft">
          <button type="button" class="gate__next" id="gateNext">生成月报</button>
        </div>
      </section>

      <!-- 吸底 CTA -->
      <div class="cta" id="cta" hidden></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="../shared.js"></script>
  <script src="monthly.js"></script>
</body>
</html>
