<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>完善收货信息 · 体重管理首诊套餐</title>
  <link rel="icon" href="../../branding-pic/icon.png" />
  <link rel="stylesheet" href="delivery.css" />
</head>
<body>
  <div class="shell">
    <div class="phone" id="phone">
      <header class="topbar" id="topbar">
        <button class="topbar__back" id="backBtn" aria-label="返回">
          <svg viewBox="0 0 24 24" fill="none"><path d="M15 6L9 12L15 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="topbar__title" id="topTitle">完善收货信息</div>
        <button class="topbar__more" id="moreBtn" aria-label="更多"><span></span><span></span><span></span></button>
      </header>

      <!-- 进度环节：已支付→完善信息→医生评估→药品发货→完成 -->
      <nav class="steps" aria-label="订单进度">
        <div class="st is-done">
          <span class="st__dot"><svg viewBox="0 0 24 24" fill="none"><path d="M6 12.5l4 4L18 8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span class="st__t">已支付</span>
        </div>
        <span class="st-line is-done"></span>
        <div class="st is-cur">
          <span class="st__dot"><i></i></span>
          <span class="st__t">完善信息</span>
        </div>
        <span class="st-line"></span>
        <div class="st">
          <span class="st__dot">3</span>
          <span class="st__t">医生评估</span>
        </div>
        <span class="st-line"></span>
        <div class="st">
          <span class="st__dot">4</span>
          <span class="st__t">药品发货</span>
        </div>
        <span class="st-line"></span>
        <div class="st">
          <span class="st__dot">5</span>
          <span class="st__t">完成</span>
        </div>
      </nav>

      <main class="page" id="view">
        <!-- 收货信息卡：空态展示，出口进专门填写页 -->
        <section class="card info">
          <div class="row">
            <span class="row__k">订单状态</span>
            <span class="row__v" id="rState">待完善收货信息</span>
          </div>
          <div class="row">
            <span class="row__k">收件人</span>
            <span class="row__v" id="rName" data-empty="待完善"></span>
          </div>
          <div class="row">
            <span class="row__k">收货地址</span>
            <span class="row__v" id="rAddr" data-empty="待完善"></span>
          </div>
          <div class="row">
            <span class="row__k">希望收货时间</span>
            <span class="row__v" id="rTime" data-empty="待完善"></span>
          </div>
        </section>

        <p class="note">药品需冷链配送，请完善收货信息以确保顺利签收；收货后请立即将药品放入冰箱冷藏（2–8℃）。</p>
      </main>

      <!-- 吸底：去填写收货信息 -->
      <footer class="paybar" id="paybar">
        <button class="btn fixbar__btn" id="goBtn" type="button">去填写收货信息</button>
      </footer>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="../../shared.js"></script>
  <script src="delivery.js"></script>
</body>
</html>
