<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>减重套餐流程 · 体重管理首诊套餐</title>
  <link rel="icon" href="../../branding-pic/icon.png" />
  <link rel="stylesheet" href="delivery.css" />
</head>
<body>
  <div class="shell">
    <div class="phone" id="phone">
      <header class="topbar" id="topbar">
        <button class="topbar__back" id="backBtn" aria-label="返回">
          <svg viewBox="0 0 24 24" fill="none"><path d="M15 6L9 12L15 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="topbar__title" id="topTitle">减重套餐流程</div>
        <button class="topbar__more" id="moreBtn" aria-label="更多"><span></span><span></span><span></span></button>
      </header>

      <!-- 进度环节：JS 按当前环节渲染（已支付→医生评估→填写物流→发货→完成） -->
      <nav class="steps" id="steps" aria-label="订单进度"></nav>

      <main class="page" id="view"></main>

      <!-- 吸底：仅「填写物流」环节展示 -->
      <footer class="paybar" id="paybar" hidden>
        <button class="btn fixbar__btn" id="goBtn" type="button">去填写收货信息</button>
      </footer>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="../../shared.js"></script>
  <script src="delivery.js"></script>
</body>
</html>
